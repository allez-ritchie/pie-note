name: pie_note
description: "PieNote - 基于离线部署 Open Notebook 的 Markdown 笔记客户端"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # 状态管理：配置状态、API 客户端、列表页 AsyncNotifier
  flutter_riverpod: ^2.6.1
  # HTTP 客户端
  http: ^1.6.0
  # 非敏感配置持久化（Base URL、主题、最近访问）
  shared_preferences: ^2.5.6
  # 密码持久化（Android Keystore 加密）
  flutter_secure_storage: ^11.2.0
  # Markdown 渲染
  flutter_markdown_plus: ^1.0.12
  # Markdown AST（自定义围栏代码块构建器要读 pre/code 节点，见 markdown_code_block.dart）
  markdown: ^7.3.1
  # Markdown 中的外链跳转浏览器（图片链接不处理）
  url_launcher: ^6.3.3
  cupertino_icons: ^1.0.9
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # 应用图标（桌面端窗口图标用；Android/Windows 的启动器图标已生成到平台目录）
    - assets/branding/app_icon.png
